                      - text: "| on:"
                      - link "Notes on the Perfidy of Dashboards" [ref=f7e49] [cursor=pointer]:
                        - /url: item?id=28328724
                - generic [ref=f7e51]:
                  - text: Not the OP, but in my experience, when clinicians ask for more data, they're actually asking for more lineage or provenance metadata.
                  - paragraph [ref=f7e52]: "We boiled it down for our teams like this:"
                  - paragraph [ref=f7e53]: "Administrators are top-down: they want a high-level view and to be able to drill down from there."
                  - paragraph [ref=f7e54]: "Individual physicians are bottom-up: they want \"their\" data about \"their\" patients, and maybe, sometimes, to compare to the peers they personally trust."
                  - paragraph [ref=f7e55]: As with any professional group, there's some minority percentage that treats their work like a craft and knows how to use data to improve their practices; but the majority want qualitative data and value interpersonal relationships. Giving a dashboard to the latter group at all is wasting time and effort of all parties.
                  - paragraph [ref=f7e56]: If your dashboard can't attribute all of its data and all of the patients referenced to match the physician's definition of "theirs," you've lost. That's the "more data" and "drill down" physicians care about.
                  - paragraph [ref=f7e57]: If your dashboard isn't timely and clinical -- which generally means presented in a clinical voice, at the point of care, or otherwise when they have an opportunity to make the change you want them to make -- it's not going to be actionable. That means surfacing some alternative action right before they see a patient which might benefit from that, which is not when they're on their computer. They might be one of those doctors that never is on their computer until the very end of the day. Looking at your dashboard at 11pm about the patients from earlier today (or more likely, earlier this past quarter of the year) is not helpful.
                  - paragraph [ref=f7e58]: Looking at your dashboard is non-clinical work, and doctors want to do clinical work. If you're going to make them go do a new and non-clinical thing, it has to reduce some other non-clinical thing in a way that's meaningful to them. Otherwise, they're just as likely to do an end-run around your application entirely, like the doctors who only use index cards to write notes or who fail to enter their passwords every morning and lock themselves out, so they don't have to use the EMR.
