      - paragraph [ref=f11e209]:
        - strong [ref=f11e210]: "Cut at the critique: the full lineage tree."
        - text: It stood under a "later" label with its parent given as "analyst depth", which is neither a barrier nor a job. That is exactly the shelter the rule forbids, and an orphan carrying a priority label travels into the IA stage where the label reads as a decision. If it has a parent, that parent is on the other persona's map.
      - paragraph [ref=f11e211]:
        - strong [ref=f11e212]: Item 8 is not the growth mechanic, and the first version let the two be read as one.
        - text: "Item 8 is delivery: the number reaches the person who has to use it, and without it the first step cannot happen. The growth mechanic is recruitment: a reader pulling another reader into the product. They share a gesture and answer to different things, which is why one has a parent and a label and the other has neither."
      - paragraph [ref=f11e213]:
        - strong [ref=f11e214]: Item 11 needs its note.
        - text: "By the rule above, search is not path-breaking: the reader arrives by link and never searches. By the project rules it is MVP, as the analyst's necessary half. The map that would settle it is the other persona's, and it has not been built. It stays in, and the reason it cannot be checked here is recorded rather than argued away."
      - generic [ref=f11e215]:
        - generic [ref=f11e216]: What the first test actually needs, which is much less than MVP
        - paragraph [ref=f11e217]:
          - text: The first test of the riskiest assumption is three companies times five metrics on hand-made static pages.
          - strong [ref=f11e218]: It needs items 1, 3, 5 and 8 only.
          - text: "No source connection, no registry, no search, no attribution, no snapshot: hand-made pages have no live source and no second definition to compare against. Four capabilities carry the entire risk, and the rest is the product that follows if the risk clears."
