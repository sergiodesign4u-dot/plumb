        - text: "The As-Is map carries no emotional intensity at any phase: its single plotted point was withdrawn at the critique when its sources turned out to report waiting rather than how waiting feels. So the target emotions here"
        - strong [ref=f11e24]: have no measured baseline to be an improvement over
