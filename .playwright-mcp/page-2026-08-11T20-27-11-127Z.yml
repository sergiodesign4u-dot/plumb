        - paragraph [ref=f23e697]:
          - text: No new collection happened, and two open questions acquired a precise place in a route, which is what an IA is supposed to do to a research gap.
          - strong [ref=f23e698]: "What a data lead considers safe to show a reader with no access is now a branch in the main flow:"
          - text: "either the owner is named and the reader has somebody to ask, or the route is a dead end with no home and nothing to sign into. Both endings are drawn, and the answer decides which one real readers meet. A second half was not in this file before: whether we may show a"
          - strong [ref=f23e699]: route
          - text: to reach that person, not only their name.
        - paragraph [ref=f23e700]:
          - strong [ref=f23e701]: "And one hole nothing here covers at all:"
          - text: what happens to a metric whose owner has left the company. The product prevents an unowned metric at creation and prevents nothing afterwards, and we do not track employment. Full detail in
