      - generic [ref=f23e459]:
        - generic [ref=f23e460]: The pattern across all five
        - paragraph [ref=f23e461]: Nobody scores above 3 on attribution. Every one of these products tells you how old a value is, several tell you how uncertain it is, and not one tells you who is answerable for it. That is the same hole the competitor set has, reached from a completely different direction.
      - heading "Top three mechanisms into the MVP" [level=3] [ref=f23e462]
      - list [ref=f23e463]:
        - listitem [ref=f23e464]:
          - strong [ref=f23e465]: A named state vocabulary instead of one alarm.
          - text: From GitHub Status. A stale number, a broken source and a changed definition become three states with three treatments, never one red badge.
        - listitem [ref=f23e466]:
          - strong [ref=f23e467]: Evidence on the claim, one action away.
          - text: From Wikipedia. A provenance marker on the number and on the definition, opening inline rather than routing to a lineage screen.
        - listitem [ref=f23e468]:
          - strong [ref=f23e469]: Expectation and reality side by side, with age in relative time.
          - text: "From FlightAware. On the freshness line: \"as of 14:05, 20 minutes ago, expected hourly\"."
      - list [ref=f23e470]:
        - listitem [ref=f23e471]: stale
        - listitem [ref=f23e472]: source is down
        - listitem [ref=f23e473]: definition changed after this was saved
        - listitem [ref=f23e474]: as of 14:05, 20 minutes ago
      - heading "One mechanism that will not work for us" [level=3] [ref=f23e475]
      - paragraph [ref=f23e476]:
        - strong [ref=f23e477]: An aggregate uptime figure, as in "99.42% over the past 90 days".
        - text: It works for GitHub because a service is either callable or not. A metric is not like that. The same shape would read as "this number is 99.4% correct", which nobody can defend, and it would let the reader skip the only question that matters at the moment of reading. We build no trust score.
      - paragraph [ref=f23e478]: The three mechanism names, ambiguity aversion, cost of verification and comparison without arithmetic, are framing borrowed from general behavioural literature rather than sources opened in this session. What is observed is what the products do. The named mechanism is our explanation of why it works.
