      - paragraph [ref=f23e652]:
        - strong [ref=f23e653]: The question.
        - text: What surface do these people read numbers in today, and does a business reader arrive at a number through a link somebody sent, or by opening a dashboard themselves? It is the footing of the entry-point behaviour, of the first-screen decision and of the pattern choice.
      - heading "What was found" [level=3] [ref=f23e654]
      - paragraph [ref=f23e655]: Dates are given for the material, not only for the visit.
      - generic [ref=f23e656]:
        - generic [ref=f23e657]: dbt Community Forum, thread dated 2019
        - paragraph [ref=f23e658]: "\"If there is a question you are getting asked frequently and you find yourself pulling the same data for multiple users, then it almost always is a good use of your time to set that up as a dashboard\""
        - paragraph [ref=f23e659]: "\"most 'business users' like product managers have a lot on their plate already, and beyond understanding / reporting on their domain, it's unlikely most of them will be able to dedicate the time necessary to deeply explore their data or make sense of it\""
      - generic [ref=f23e660]:
        - generic [ref=f23e661]: Hacker News, 2021
        - paragraph [ref=f23e662]: "\"The main problem is that it's not easy to drill down into a metric in most BI tools because the connection between the dashboard and the source data is usually missing\""
      - paragraph [ref=f23e663]:
        - strong [ref=f23e664]: What that changes.
        - text: "Two claims that had rested on our own brief now have a source outside it: the analyst is repeatedly asked the same question, and the business reader does not invest time in digging. One thing is new rather than confirmed: the field's default answer to the repeated question is"
        - strong [ref=f23e665]: to build a dashboard
        - text: ", so that is what our registry is hired against, not a competitor product. And the missing link between a number and its source is described from outside the vendor category, which is the first non-vendor voice we have on the central gap."
