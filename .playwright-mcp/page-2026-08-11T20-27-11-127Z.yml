    - generic [ref=f23e16]:
      - generic [ref=f23e17]:
        - generic [ref=f23e18]: "01"
        - heading "Introduction" [level=2] [ref=f23e19]
      - paragraph [ref=f23e20]:
        - strong [ref=f23e21]: Goal.
        - text: "Remove the daily friction of reconciliation, when two people arrive at a meeting with different numbers for the same thing and spend half an hour working out whose number is right. The expensive version is quieter: nobody argues, and a decision gets made on a number nobody owns."
      - paragraph [ref=f23e22]:
        - strong [ref=f23e23]: Problem.
        - text: "The definition is already owned by producer tools: dbt, Looker's LookML, Atlan's metrics layer. What nobody owns is the last mile. The number arrives in front of the person who will act on it stripped of everything that would let them judge it."
      - paragraph [ref=f23e24]:
        - strong [ref=f23e25]: Approach.
        - text: Seven levels, from the concrete to the synthesis. Playwright first for every page, documentation used where the product sits behind a login, and no accounts created anywhere.
      - heading "Five findings" [level=3] [ref=f23e26]
      - list [ref=f23e27]:
        - listitem [ref=f23e28]:
          - strong [ref=f23e29]: Provenance exists in every product and lives nowhere near the reader.
          - text: "Lineage, catalog and incident are all destinations. To travel to one you must already suspect something, and the person we care about does not suspect anything yet. Strength stated exactly: shown for the five products whose documentation we opened, inferred for the other ten from positioning."
        - listitem [ref=f23e30]:
          - strong [ref=f23e31]: Attribution on the claim is unoccupied, confirmed from two independent corpora.
          - text: In the category, certification is a badge and the name appears only when it is removed. Outside the category, across five products chosen for this dimension, not one scores above 3 on attribution while several score 5 on freshness.
        - listitem [ref=f23e32]:
          - strong [ref=f23e33]: The category changed its subject in 2026 and vacated our ground.
          - text: Fourteen of the fifteen pages opened put AI or agents in the headline.
          - code [ref=f23e34]: montecarlodata.com
          - text: now redirects to
          - code [ref=f23e35]: montecarlo.ai
          - text: and the observability leader sells "Trust your agents in production".
        - listitem [ref=f23e36]:
          - strong [ref=f23e37]: Nobody positions on the moment that matters.
          - text: Not one of the fifteen pages mentions a phone, a meeting, or the minutes before one. How those interfaces behave at a narrow viewport stays unknown, since none can be reached without an account.
        - listitem [ref=f23e38]:
          - strong [ref=f23e39]: There is no reader-pricing norm, only a choice.
          - text: Unlimited viewers at Secoda, $20 per viewer per month at Cube, a separate Viewer license at Looker, metric caps of 50 and 200 at PowerMetrics.
      - heading "What the research confirmed, narrowed and changed" [level=3] [ref=f23e40]
      - paragraph [ref=f23e41]:
        - strong [ref=f23e42]: Confirmed.
        - text: The market names the problem in its own words. dbt writes that "inconsistent metrics, slow queries, and scattered tools can quickly erode trust". The positioning line in the brief, that Plumb is not built to visualise data but to make a number defensible, survives contact with fifteen products.
      - paragraph [ref=f23e43]:
        - strong [ref=f23e44]: Narrowed, and this is the most useful outcome of opening the documentation.
        - text: "Two of the four gaps we thought we had are partly occupied. Doubt as a vocabulary already exists: dbt runs four health states. Ownership on the claim already exists as an exception: PowerMetrics names who removed a certification. Our version of both is"
        - strong [ref=f23e45]: placement
        - text: ", not invention."
      - paragraph [ref=f23e46]:
        - strong [ref=f23e47]: Changed.
        - text: "Mobile-first stopped being a preference and became the measured gap. Permissions reach into provenance, which touches the free-reader model directly. Column-level lineage sits behind Enterprise at dbt, which says what depth costs. And two decisions the brief could not have anticipated: our doubt is not an incident, and we build no trust score."
