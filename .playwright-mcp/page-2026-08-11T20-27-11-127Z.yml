        - text: "This is an assumption taken from the brief and from the shape of the market, not an observation, and it is the weakest link in the chain below. It decides the location of the product before any other question is asked: if the reader is inside the producing tool, a catalog, a graph or a board are all legitimate answers; if the reader is outside, all three lose by default."
