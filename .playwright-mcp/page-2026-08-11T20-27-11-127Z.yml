      - paragraph [ref=f23e124]:
        - text: Two structural facts shape everything in the table.
        - strong [ref=f23e125]: "The funnel has two bodies and one wallet:"
        - text: the analyst pays and never spreads, the reader spreads and never pays, and any metric that averages them looks healthiest exactly when the readers stop coming.
      - generic [ref=f23e126]:
        - generic [ref=f23e127]: The activation node
        - paragraph [ref=f23e128]:
          - strong [ref=f23e129]: The first time a metric card is opened by somebody other than the person who wrote its definition.
          - text: Connecting a source, writing a definition and naming an owner are setup, not activation. The activation event and the event predicted by the riskiest assumption are the same event, so the funnel cannot read green while the strategy is wrong.
