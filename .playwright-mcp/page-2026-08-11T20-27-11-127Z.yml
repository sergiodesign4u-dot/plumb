      - paragraph [ref=f23e7]: Plumb · Stage 01 · Foundation Research
      - heading "What we know before anything is designed" [level=1] [ref=f23e8]
      - paragraph [ref=f23e9]: Fifteen competitors opened page by page, five best-in-class products from other categories scored on one dimension, a strategy sheet, a funnel and a deliberate choice of pattern. This page is the research as it stands, including the parts of it that are still assumptions.
