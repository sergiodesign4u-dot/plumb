          - heading "4. User outcomes and benefits" [level=5] [ref=f23e77]
          - paragraph [ref=f23e78]: "Reader: when I am about to paste a number into a deck, I want to know in a few seconds whether it still holds, so I am not caught out in front of leadership."
          - paragraph [ref=f23e79]: "Analyst: when I am asked for the third time this week why two dashboards disagree, I want to answer once and have the answer stay answered."
        - generic [ref=f23e80]:
          - heading "5. Solutions (MVP)" [level=5] [ref=f23e81]
          - list [ref=f23e82]:
            - listitem [ref=f23e83]: One source connection, metric registry with definition and owner
            - listitem [ref=f23e84]: Number card carrying provenance, age and state
            - listitem [ref=f23e85]: Named states instead of one alarm
            - listitem [ref=f23e86]: Attribution on every definition
            - listitem [ref=f23e87]: "Not built: trust score, incident workflow"
        - generic [ref=f23e88]:
          - heading "6. Hypotheses" [level=5] [ref=f23e89]
          - paragraph [ref=f23e90]: Six, in the "if / then / because" form, in section 07 below. One of them is the assumption the whole idea rests on.
        - generic [ref=f23e91]:
          - heading "7. Riskiest assumption" [level=5] [ref=f23e92]
          - paragraph [ref=f23e93]:
            - strong [ref=f23e94]: A business consumer will read the number in Plumb, before they use it, instead of using the figure they already have in the dashboard, the Slack message or the deck.
          - paragraph [ref=f23e95]: A value risk, not a feasibility risk. Rendering a card next to a number is not hard. Getting a person under time pressure to check something they did not doubt is the whole bet.
        - generic [ref=f23e96]:
          - heading "8. First test" [level=5] [ref=f23e97]
          - paragraph [ref=f23e98]: "Three companies, five metrics each, static pages made by hand, no build. For two weeks the analyst answers every \"why is this number different\" with the link and nothing else. The signal that decides it is not the open rate: it is whether any reader stopped using a number because the card told them not to. If that never happens in two weeks, the assumption is not confirmed, whatever the open rate says."
    - generic [ref=f23e99]:
      - generic [ref=f23e100]:
        - generic [ref=f23e101]: "02"
        - heading "Strategy" [level=2] [ref=f23e102]
      - paragraph [ref=f23e103]: The one-sheet version is above. This is the same strategy with the reasoning attached.
      - heading "Audience" [level=3] [ref=f23e104]
      - paragraph [ref=f23e105]: Three parties, one deliberately without a product surface.
      - list [ref=f23e106]:
        - listitem [ref=f23e107]:
          - strong [ref=f23e108]: Analyst or data lead.
          - text: Primary user and the payer. 28 to 40, company of 50 to 300, data team of 1 to 5. Interrupted several times a week by "why is this number different".
        - listitem [ref=f23e109]:
          - strong [ref=f23e110]: Business consumer of the number.
          - text: "PM, marketer, finance. Unpaid, and the one the market underserves. Not our invention as a persona: Secoda names Data Consumers, Business Operations and Product Managers on its own site."
        - listitem [ref=f23e111]:
          - strong [ref=f23e112]: Head of data or COO.
          - text: Buyer, not user. Kept off the product surface so three personas do not compete for 15 to 30 screens.
      - paragraph [ref=f23e113]: All three descriptions come from the brief, not from observation. Ages, team sizes, interruption frequency and buyer behaviour are assumptions, and they stay unverified until stage 02 interviews people. They are here because the product was designed against them, not because they were checked.
      - heading "Business model" [level=3] [ref=f23e114]
      - paragraph [ref=f23e115]: "Seat-based, analyst seats paid, readers free or near free, no cap on metric count. The reasoning is mechanical rather than generous: the value of Plumb grows with the number of people who see a number with its provenance, so charging per reader taxes our own growth mechanism, and charging per metric taxes activation."
      - generic [ref=f23e116]:
        - generic [ref=f23e117]: The riskiest assumption
        - paragraph [ref=f23e118]: A business consumer will read the number in Plumb, before they use it, instead of using the figure they already have in the dashboard, the Slack message or the deck.
      - paragraph [ref=f23e119]: "The quiet argument that it really is the risky one: not a single product in the fifteen treats the reading surface as its own product. Either all of them missed it, or the last mile is hard to take."
