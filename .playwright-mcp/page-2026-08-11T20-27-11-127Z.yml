      - paragraph [ref=f23e175]: Four of those five targets come from nowhere and are placeholders to be replaced by the first cohort. Only the 30-day window has an external anchor, the PowerMetrics 30-day trial. A stated number can be shown wrong; an unstated one cannot, which is the whole reason they are written down.
      - heading "Two conclusions that cost us something" [level=3] [ref=f23e176]
      - paragraph [ref=f23e177]:
        - strong [ref=f23e178]: Retention is the weakest stage and our own scope cut made it so.
        - text: Notification routing is out of MVP, so nothing reaches out, and the stage rests entirely on a permanent URL plus a card that has something new to say when reopened.
      - paragraph [ref=f23e179]:
        - strong [ref=f23e180]: Referral grows readers, not logos.
        - text: Metrics are internal, cards travel inside a company, so the loop raises readers per seat and produces almost no new accounts. New accounts have to be earned in acquisition.
      - paragraph [ref=f23e181]:
        - strong [ref=f23e182]: One requirement this funnel puts on the IA.
        - text: The retention metric can only tell "came back alone" from "was sent the link again" if the share event is recorded next to the open event. Stage 03a step 4 has to carry that into the flow of the main job, otherwise the metric silently measures the analyst instead of the reader.
