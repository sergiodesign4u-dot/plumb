        - text: No public source was found in which a business reader reports their own feeling while waiting on an answer about a number. The As-Is map now carries no emotional intensity at any phase, and says so.
      - heading "Result off the question, which is where the value landed" [level=3] [ref=f23e680]
      - paragraph [ref=f23e681]: Hacker News comment 28050270, dated 2021-08-03. The author identifies as a CFO that has used spreadsheets my entire career (30+years). This is the only source in this research spoken in the first person by somebody holding our primary persona's role.
      - generic [ref=f23e682]:
        - generic [ref=f23e683]: On waiting
        - paragraph [ref=f23e684]: "\"To get a SQL/Python (or other programming language) solution requires submitting a request to IT and then waiting two years to work up the priority queue. This is not a complaint against IT and the priority process.\""
      - generic [ref=f23e685]:
        - generic [ref=f23e686]: On a stale figure hiding in plain sight
        - paragraph [ref=f23e687]: "\"you get the scenario the author describes of hard-coded values in cells that once contained formulas. These are almost impossible to find in worksheets with large numbers of tabs and thousands of formulas.\""
        - paragraph [ref=f23e688]: "\"people really do not track properly what each version contains and what are the true differences\""
      - paragraph [ref=f23e689]:
        - strong [ref=f23e690]: What it changes.
        - text: The second quote gives the "number travels on" phase its first evidenced barrier, which promotes a growth zone the CJM had rejected for having no parent. It is also the first outside support for benchmark criterion 8, no false calm, coming from a person rather than from a product page.
      - paragraph [ref=f23e691]:
        - strong [ref=f23e692]: What it does not change.
        - text: The object is a spreadsheet, not a metric surface, so it is the right population and the wrong artefact. It says nothing about whether a reader returns to a number they saved. And a CFO working in spreadsheets is one data point about where finance people work, not an answer to what surface our reader reads a number in.
      - paragraph [ref=f23e693]:
        - strong [ref=f23e694]: Method note worth keeping.
        - text: The stage 02 round concluded that the Hacker News corpus was exhausted for this question. It was not. This source came up on roughly the thirteenth query phrasing, which is a fact about our queries rather than about the corpus.
