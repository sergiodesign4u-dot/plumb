          - generic [ref=f69e42]:
            - paragraph [ref=f69e43]:
              - emphasis [ref=f69e44]: When you sign up for a free PowerMetrics trial, you get access for 30 days to our data warehouse integration for Snowflake. To continue using this feature when your trial period ends, purchase a plan that includes the “data warehouse integration” or one that allows you to buy the “data warehouse integration add-on”. Want to see how PowerMetrics works before connecting it to your own data? Our
              - link [ref=f69e45] [cursor=pointer]:
                - /url: https://support.powermetrics.app/hc/en-us/articles/37726136313751-learning-with-sample-metrics
                - emphasis [ref=f69e46]: sample metrics
              - emphasis [ref=f69e47]: are the perfect, risk-free way to do just that.
            - paragraph [ref=f69e48]: Connect to data in your Snowflake warehouse and create metrics to add to your organization’s metric catalog. From there, business users can securely access metrics from the Snowflake warehouse that they need for visualization, discovery, and dashboarding.
            - paragraph [ref=f69e49]: "This article includes:"
