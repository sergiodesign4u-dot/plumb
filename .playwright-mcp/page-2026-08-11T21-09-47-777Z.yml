            - generic [ref=f35e390]:
              - generic [ref=f35e391]: On-demand learning
              - paragraph [ref=f35e396]:
                - text: If you enjoy video courses, check out our
                - link "dbt Catalog on-demand course" [ref=f35e397] [cursor=pointer]:
                  - /url: https://learn.getdbt.com/courses/dbt-catalog
                - text: and learn how to best explore your dbt project(s)!
            - heading [level=2] [ref=f35e398] [cursor=pointer]:
              - text: Explore your project's lineage graph
              - link "Direct link to Explore your project's lineage graph" [ref=f35e399]:
                - /url: "#project-lineage"
            - paragraph [ref=f35e400]:
              - text: Catalog provides a visualization of your project's DAG that you can interact with. To access the project's full lineage graph, select
              - strong [ref=f35e401]: Overview
              - text: in the left sidebar and click the
              - strong [ref=f35e402]: Explore Lineage
              - text: button on the main (center) section of the page.
            - paragraph [ref=f35e403]:
              - text: If you don't see the project lineage graph immediately, click
              - strong [ref=f35e404]: Render Lineage
              - text: . It can take some time for the graph to render depending on the size of your project and your computer's available memory. The graph of very large projects might not render so you can select a subset of nodes by using selectors, instead.
            - paragraph [ref=f35e405]: The nodes in the lineage graph represent the project's resources and the edges represent the relationships between the nodes. Nodes are color-coded and include iconography according to their resource type.
            - paragraph [ref=f35e406]:
              - text: By default, Catalog shows the project's
              - link "applied state" [ref=f35e407] [cursor=pointer]:
                - /url: /docs/dbt-apis/project-state#definition-logical-vs-applied-state-of-dbt-nodes
              - text: lineage. That is, it shows models that have been successfully built and are available to query, not just the models defined in the project.
            - paragraph [ref=f35e408]:
              - text: To explore the lineage graphs of tests and macros, view
              - link "their resource details pages" [ref=f35e409] [cursor=pointer]:
                - /url: "#view-resource-details"
              - text: . By default, Catalog excludes these resources from the full lineage graph unless a search query returns them as results.
            - group [ref=f35e410]:
              - generic "How can I interact with the full lineage graph?" [ref=f35e411] [cursor=pointer]
            - heading [level=3] [ref=f35e415] [cursor=pointer]:
              - text: Example of full lineage graph
              - link "Direct link to Example of full lineage graph" [ref=f35e416]:
                - /url: "#example-of-full-lineage-graph"
            - paragraph [ref=f35e417]: "To explore a model in your project's lineage graph in Catalog:"
            - list [ref=f35e418]:
              - listitem [ref=f35e419]: Select your project in the left sidebar.
              - listitem [ref=f35e420]:
                - text: Click the
                - strong [ref=f35e421]: View lineage
                - text: button.
              - listitem [ref=f35e422]: Click a model to view the description.
            - generic [ref=f35e423]:
              - link [ref=f35e425] [cursor=pointer]:
                - /url: "#"
                - img "Example of full lineage graph" [ref=f35e426]
              - generic [ref=f35e427]: Example of full lineage graph
            - heading [level=2] [ref=f35e428] [cursor=pointer]:
              - text: Lenses
              - link "Direct link to Lenses" [ref=f35e429]:
                - /url: "#lenses"
            - paragraph [ref=f35e430]:
              - text: The
              - strong [ref=f35e431]: Lenses
              - text: feature is available from your
              - link "project's lineage graph" [ref=f35e432] [cursor=pointer]:
                - /url: "#project-lineage"
              - text: (lower right corner). Lenses are like map layers for your DAG. Lenses make it easier to understand your project's contextual metadata at scale, especially to distinguish a particular model or a subset of models.
            - paragraph [ref=f35e433]: When you apply a lens, tags become visible on the nodes in the lineage graph, indicating the layer value along with coloration based on that value. If you're significantly zoomed out, only the tags and their colors are visible in the graph.
            - paragraph [ref=f35e434]: Lenses are helpful to analyze a subset of the DAG if you're zoomed in, or to find models/issues from a larger vantage point.
            - group [ref=f35e435]:
              - generic "List of available lenses" [ref=f35e436] [cursor=pointer]
            - heading [level=3] [ref=f35e440] [cursor=pointer]:
              - text: Example of lenses
              - link "Direct link to Example of lenses" [ref=f35e441]:
                - /url: "#example-of-lenses"
