            - paragraph [ref=f35e593]:
              - text: Catalog supports views for
              - link "staging deployment environments" [ref=f35e594] [cursor=pointer]:
                - /url: /docs/deploy/deploy-environments#staging-environment
              - text: ", in addition to the production environment. This gives you a unique view into your pre-production data workflows, with the same tools available in production, while providing an extra layer of scrutiny."
            - paragraph [ref=f35e595]:
              - text: You can explore the metadata from your production or staging environment to inform your data development lifecycle. Just
              - link "set a single environment" [ref=f35e596] [cursor=pointer]:
                - /url: /docs/deploy/deploy-environments
              - text: per dbt project as "production" or "staging," and ensure the proper metadata has been generated then you'll be able to view it in Catalog. Refer to
              - link "Generating metadata" [ref=f35e597] [cursor=pointer]:
                - /url: /docs/explore/explore-projects#generate-metadata
              - text: for more details.
