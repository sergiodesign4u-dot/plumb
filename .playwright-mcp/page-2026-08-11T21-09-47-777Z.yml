              - text: Example of applying the
              - strong [ref=f35e443]: Materialization type
              - emphasis [ref=f35e444]: lens
              - text: on a zoomed-out lineage graph. In the bottom-left corner, open
              - strong [ref=f35e445]: Lenses
              - text: and select
              - strong [ref=f35e446]: Materialization type
              - text: ". Each node displays a colored badge for its related materialization type:"
            - list [ref=f35e447]:
              - listitem [ref=f35e448]: Table
              - listitem [ref=f35e449]: View
              - listitem [ref=f35e450]: Incremental
              - listitem [ref=f35e451]: Ephemeral
              - listitem [ref=f35e452]: Materialized View.
