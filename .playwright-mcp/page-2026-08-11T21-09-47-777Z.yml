            - generic [ref=f35e208]:
              - generic [ref=f35e209]: tip
              - paragraph [ref=f35e214]:
                - text: If your organization works in both dbt Core and Cloud, you can unify these workflows by automatically uploading dbt Core artifacts into dbt Cloud and viewing them in Catalog for a more connected dbt experience. To learn more, visit
                - link "hybrid projects" [ref=f35e215] [cursor=pointer]:
                  - /url: /docs/deploy/hybrid-projects
                - text: .
            - heading [level=3] [ref=f35e216] [cursor=pointer]:
              - text: External metadata ingestion
              - link "Preview" [ref=f35e217]:
                - /url: https://docs.getdbt.com/docs/dbt-versions/product-lifecycles
              - link "Direct link to external-metadata-ingestion-" [ref=f35e218]:
                - /url: "#external-metadata-ingestion-"
            - paragraph [ref=f35e219]:
              - text: Connect directly to your data warehouse with
              - link "external metadata ingestion" [ref=f35e220] [cursor=pointer]:
                - /url: /docs/explore/external-metadata-ingestion
              - text: ", giving you visibility into tables, views, and other resources that aren't defined in dbt with Catalog."
            - paragraph [ref=f35e221]:
              - text: We create dbt metadata and pull external metadata. Catalog uses the metadata provided by the
              - link "Discovery API" [ref=f35e222] [cursor=pointer]:
                - /url: /docs/dbt-apis/discovery-api
              - text: to display details about the state of your project. The available metadata depends on which
              - link "deployment environment" [ref=f35e223] [cursor=pointer]:
                - /url: /docs/deploy/deploy-environments
              - text: you’ve designated as production or staging in your dbt project.
            - heading [level=2] [ref=f35e224] [cursor=pointer]:
              - text: Catalog overview
              - link "Direct link to Catalog overview" [ref=f35e225]:
                - /url: "#catalog-overview"
            - generic [ref=f35e226]:
              - generic [ref=f35e227]:
                - link "Global navigation" [ref=f35e231] [cursor=pointer]:
                  - /url: /docs/explore/global-navigation
                - link "Starter" [ref=f35e232] [cursor=pointer]:
                  - /url: https://www.getdbt.com/pricing
                - link "Enterprise" [ref=f35e233] [cursor=pointer]:
                  - /url: https://www.getdbt.com/pricing
                - link "Enterprise +" [ref=f35e234] [cursor=pointer]:
                  - /url: https://www.getdbt.com/pricing
              - paragraph [ref=f35e236]:
                - text: Catalog introduces the ability to widen your search by including dbt resources (models, seeds, snapshots, sources, exposures, and more) across your entire account. This broadens the results returned and gives you greater insight into all the assets across your dbt projects. Learn more in
                - link "Global navigation" [ref=f35e237] [cursor=pointer]:
                  - /url: /docs/explore/global-navigation
                - text: or in our
                - link "video overview" [ref=f35e238] [cursor=pointer]:
                  - /url: https://www.loom.com/share/ae93b3d241cd439fbe5f98f5e6872113?
                - text: .
            - paragraph [ref=f35e239]: "Navigate the Catalog overview page to access your project's resources and metadata. The page includes the following sections:"
            - list [ref=f35e240]:
              - listitem [ref=f35e241]:
                - strong [ref=f35e242]: Search bar
                - text: —
                - link "Search" [ref=f35e243] [cursor=pointer]:
                  - /url: "#search-resources"
                - text: for resources in your project by keyword. You can also use filters to refine your search results.
              - listitem [ref=f35e244]:
                - strong [ref=f35e245]: Sidebar
                - text: — Use the left sidebar to browse your project's
                - link "resources, file tree, and database" [ref=f35e246] [cursor=pointer]:
                  - /url: "#browse-with-the-sidebar"
                - text: in the lower section of the sidebar. You can also browse model
                - link "performance" [ref=f35e247] [cursor=pointer]:
                  - /url: /docs/explore/model-performance
                - text: and
                - link "project recommendations" [ref=f35e248] [cursor=pointer]:
                  - /url: /docs/explore/project-recommendations
                - text: depending on your plan. Refer to
                - link "Availability by plan" [ref=f35e249] [cursor=pointer]:
                  - /url: "#availability-by-plan"
                - text: for more info.
                - list [ref=f35e250]:
                  - listitem [ref=f35e251]: Find your project recommendations within your project's landing page.*
              - listitem [ref=f35e252]:
                - strong [ref=f35e253]: Lineage graph
                - text: — Explore your project's or account's
                - link "lineage graph" [ref=f35e254] [cursor=pointer]:
                  - /url: "#project-lineage"
                - text: to visualize the relationships between resources.
              - listitem [ref=f35e255]:
                - strong [ref=f35e256]: Latest updates
                - text: — View the latest changes or issues related to your project's resources, including the most recent job runs, changed properties, lineage, and issues.
              - listitem [ref=f35e257]:
                - strong [ref=f35e258]: Marts and public models
                - text: — View the
                - link "marts" [ref=f35e259] [cursor=pointer]:
                  - /url: /best-practices/how-we-structure/1-guide-overview#guide-structure-overview
                - text: and
                - link "public models" [ref=f35e260] [cursor=pointer]:
                  - /url: /docs/mesh/govern/model-access#access-modifiers
                - text: in your project. You can also navigate to all public models in your account through this view.
              - listitem [ref=f35e261]:
                - strong [ref=f35e262]: Model query history
                - text: — Use
                - link "model query history" [ref=f35e263] [cursor=pointer]:
                  - /url: /docs/explore/model-query-history
                - text: to track consumption queries on your models for deeper insights.
              - listitem [ref=f35e264]:
                - strong [ref=f35e265]: Visualize downstream exposures
                - text: —
                - link "Set up" [ref=f35e266] [cursor=pointer]:
                  - /url: /docs/platform-integrations/downstream-exposures-tableau
                - text: and
                - link "visualize downstream exposures" [ref=f35e267] [cursor=pointer]:
                  - /url: /docs/explore/view-downstream-exposures
                - text: to automatically expose relevant data models from Tableau to enhance visibility.
              - listitem [ref=f35e268]:
                - strong [ref=f35e269]: Data health signals
                - text: — View the
                - link "data-health-signals" [ref=f35e270] [cursor=pointer]:
                  - /url: /docs/explore/data-health-signals
                - text: for each resource to understand its health and performance.
            - heading [level=3] [ref=f35e271] [cursor=pointer]:
              - text: Catalog permissions
              - link "Direct link to Catalog permissions" [ref=f35e272]:
                - /url: "#catalog-permissions"
            - paragraph [ref=f35e273]: When using global navigation and searching across your projects, the following permissions apply.
            - list [ref=f35e274]:
              - listitem [ref=f35e275]: Your project access permissions determine which dbt projects appear in the left-hand menu of the global navigation.
              - listitem [ref=f35e276]: In Catalog searches, we use soft access controls, you'll see all matching resources in search results, with clear indicators for items you don't have access to.
              - listitem [ref=f35e277]:
                - text: For external metadata, the global platform credential controls which resources metadata users can discover. See
                - link "External metadata ingestion" [ref=f35e278] [cursor=pointer]:
                  - /url: /docs/explore/external-metadata-ingestion
                - text: for more details.
            - heading [level=3] [ref=f35e279] [cursor=pointer]:
              - text: Availability by plan
              - link "Direct link to Availability by plan" [ref=f35e280]:
                - /url: "#availability-by-plan"
