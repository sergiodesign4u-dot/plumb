            - paragraph [ref=f35e72]:
              - paragraph [ref=f35e73]:
                - text: With Catalog, you can view your project's
                - link "resources" [ref=f35e74] [cursor=pointer]:
                  - /url: /docs/build/projects
                - text: (such as models, tests, and metrics), their lineage , and
                - link "model consumption" [ref=f35e75] [cursor=pointer]:
                  - /url: /docs/explore/view-downstream-exposures
                - text: to gain a better understanding of its latest production state.
            - paragraph [ref=f35e76]:
              - text: Use Catalog to navigate and manage your projects within dbt to help you and other data developers, analysts, and consumers discover and leverage your dbt resources. Catalog integrates with the
              - link "Studio IDE" [ref=f35e77] [cursor=pointer]:
                - /url: /docs/platform/studio-ide/develop-in-studio
              - text: ","
              - link "dbt Insights" [ref=f35e78] [cursor=pointer]:
                - /url: /docs/explore/dbt-insights
              - text: ","
              - link "Orchestrator" [ref=f35e79] [cursor=pointer]:
                - /url: /docs/deploy/deployments
              - text: ", and"
              - link "Canvas" [ref=f35e80] [cursor=pointer]:
                - /url: /docs/platform/canvas
              - text: to help you develop or view your dbt resources.
            - heading [level=2] [ref=f35e81] [cursor=pointer]:
              - text: Prerequisites
              - link "Direct link to Prerequisites" [ref=f35e82]:
                - /url: "#prerequisites"
            - list [ref=f35e83]:
              - listitem [ref=f35e84]:
                - text: You have a dbt account on the
                - link "Starter, Enterprise, or Enterprise+ plan" [ref=f35e85] [cursor=pointer]:
                  - /url: https://www.getdbt.com/pricing/
                - text: .
              - listitem [ref=f35e86]:
                - text: You have set up a
                - link "production" [ref=f35e87] [cursor=pointer]:
                  - /url: /docs/deploy/deploy-environments#set-as-production-environment
                - text: or
                - link "staging" [ref=f35e88] [cursor=pointer]:
                  - /url: /docs/deploy/deploy-environments#create-a-staging-environment
                - text: deployment environment for each project you want to explore.
              - listitem [ref=f35e89]:
                - text: You have at least one successful job run in the deployment environment. Note that
                - link "CI jobs" [ref=f35e90] [cursor=pointer]:
                  - /url: /docs/deploy/ci-jobs
                - text: do not update Catalog.
              - listitem [ref=f35e91]:
                - text: You are on the Catalog page. To do this, select
                - strong [ref=f35e92]: Catalog
                - text: from the top-level navigation in dbt.
            - heading [level=2] [ref=f35e93] [cursor=pointer]:
              - text: Generate metadata
              - link "Direct link to Generate metadata" [ref=f35e94]:
                - /url: "#generate-metadata"
            - paragraph [ref=f35e95]:
              - text: Catalog uses the metadata provided by the
              - link "Discovery API" [ref=f35e96] [cursor=pointer]:
                - /url: /docs/dbt-apis/discovery-api
              - text: to display the details about
              - link "the state of your dbt project" [ref=f35e97] [cursor=pointer]:
                - /url: /docs/dbt-apis/project-state
              - text: . The metadata that's available depends on the
              - link "deployment environment" [ref=f35e98] [cursor=pointer]:
                - /url: /docs/deploy/deploy-environments
              - text: you've designated as
              - emphasis [ref=f35e99]: production
              - text: or
              - emphasis [ref=f35e100]: staging
              - text: in your dbt project.
            - paragraph [ref=f35e101]:
              - text: Catalog also allows you to ingest metadata from your data warehouse, giving you visibility into external resources in Catalog. For information on supported warehouses, refer to
              - link "External metadata ingestion" [ref=f35e102] [cursor=pointer]:
                - /url: /docs/explore/external-metadata-ingestion#prerequisites
              - text: .
            - heading [level=2] [ref=f35e103] [cursor=pointer]:
              - text: dbt metadata
              - link "Direct link to dbt metadata" [ref=f35e104]:
                - /url: "#dbt-metadata"
            - paragraph [ref=f35e105]:
              - text: If you're using a
              - link "hybrid project setup" [ref=f35e106] [cursor=pointer]:
                - /url: /docs/deploy/hybrid-setup
              - text: and uploading artifacts from dbt Core, make sure to follow the
              - link "setup instructions" [ref=f35e107] [cursor=pointer]:
                - /url: /docs/deploy/hybrid-setup#connect-project-in-dbt-cloud
              - text: to connect your project in dbt. This enables Catalog to access and display your metadata correctly.
            - list [ref=f35e108]:
              - listitem [ref=f35e109]:
                - text: To ensure all metadata is available in Catalog, run
                - code [ref=f35e110]: dbt build
                - text: and
                - code [ref=f35e111]: dbt docs generate
                - text: as part of your job in your production or staging environment. Running these two commands ensures all relevant metadata (like lineage, test results, documentation, and more) is available in Catalog.
              - listitem [ref=f35e112]:
                - text: Catalog automatically retrieves the metadata updates after each job run in the production or staging deployment environment so it always has the latest results for your project. This includes deploy and merge jobs.
                - list [ref=f35e113]:
                  - listitem [ref=f35e114]: Note that CI jobs don't update Catalog. This is because they don't reflect the production state and don't provide the necessary metadata updates.
              - listitem [ref=f35e115]: To view a resource and its metadata, you must define the resource in your project and run a job in the production or staging environment.
              - listitem [ref=f35e116]:
                - text: The resulting metadata depends on the
                - link "commands" [ref=f35e117] [cursor=pointer]:
                  - /url: /docs/deploy/job-commands
                - text: executed by the jobs.
            - heading [level=3] [ref=f35e118] [cursor=pointer]:
              - text: When dbt creates model metadata
              - link "Direct link to When dbt creates model metadata" [ref=f35e119]:
                - /url: "#when-dbt-creates-model-metadata"
            - paragraph [ref=f35e120]: "dbt populates a model's metadata in Catalog when both of the following conditions are met:"
            - list [ref=f35e121]:
              - listitem [ref=f35e122]: The model is defined in your dbt project (it exists in the manifest).
              - listitem [ref=f35e123]:
                - text: The model appears in the
                - code [ref=f35e124]: run_results
                - text: of a
                - link [ref=f35e125] [cursor=pointer]:
                  - /url: /reference/commands/build
                  - code [ref=f35e126]: dbt build
                - text: ","
                - link [ref=f35e127] [cursor=pointer]:
                  - /url: /reference/commands/run
                  - code [ref=f35e128]: dbt run
                - text: ", or"
                - link [ref=f35e129] [cursor=pointer]:
                  - /url: /reference/commands/clone
                  - code [ref=f35e130]: dbt clone
                - text: command, regardless of the run's success or failure status. Note that
                - code [ref=f35e131]: dbt docs generate
                - text: alone does not create model entries in Catalog. It provides supplementary metadata like column details and descriptions for models that already exist.
            - heading [level=3] [ref=f35e132] [cursor=pointer]:
              - text: When dbt removes model metadata
              - link "Direct link to When dbt removes model metadata" [ref=f35e133]:
                - /url: "#when-dbt-removes-model-metadata"
            - paragraph [ref=f35e134]: "dbt removes a model's metadata from Catalog in these two cases:"
            - list [ref=f35e135]:
              - listitem [ref=f35e136]:
                - strong [ref=f35e137]: Model removed from project
                - text: ": If a model is deleted from your dbt project (and therefore no longer exists in the manifest), its metadata is removed after a subsequent job run in which the model is no longer included."
              - listitem [ref=f35e138]:
                - strong [ref=f35e139]: Environment inactivity
                - text: ": If an environment has had no job runs in the past 3 months, all metadata for that environment is purged. To prevent this, schedule jobs to run at least once every 3 months."
