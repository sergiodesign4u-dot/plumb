            - heading [level=2] [ref=f35e475] [cursor=pointer]:
              - text: Keyword search
              - link "Direct link to Keyword search" [ref=f35e476]:
                - /url: "#search-resources"
            - paragraph [ref=f35e477]: With Catalog, global navigation provides a search experience allowing you to find dbt resources across all your projects, as well as non-dbt resources in Snowflake.
            - paragraph [ref=f35e478]: You can locate resources in your project by performing a keyword search in the search bar. All resource names, column names, resource descriptions, warehouse relations, and code matching your search criteria will be displayed as a list on the main (center) section of the page. When searching for an exact column name, the results show all relational nodes containing that column in their schemas. If there's a match, a notice in the search result indicates the resource contains the specified column. Also, you can apply filters to further refine your search results.
            - group [ref=f35e479]:
              - generic "Search features" [ref=f35e480] [cursor=pointer]
            - group [ref=f35e484]:
              - generic "Filters side panel" [ref=f35e485] [cursor=pointer]
            - group [ref=f35e489]:
              - generic "Global navigation" [ref=f35e490] [cursor=pointer]
            - heading [level=3] [ref=f35e494] [cursor=pointer]:
              - text: Example of keyword search
              - link "Direct link to Example of keyword search" [ref=f35e495]:
                - /url: "#example-of-keyword-search"
            - paragraph [ref=f35e496]:
              - text: Example of results from searching on the keyword
              - code [ref=f35e497]: customers
              - text: and applying the filters models, description, and code.
              - link "Data health signals" [ref=f35e498] [cursor=pointer]:
                - /url: /docs/explore/data-health-signals
              - text: are visible to the right of the model name in the search results.
            - heading [level=2] [ref=f35e499] [cursor=pointer]:
              - text: Browse with the sidebar
              - link "Direct link to Browse with the sidebar" [ref=f35e500]:
                - /url: "#browse-with-the-sidebar"
            - paragraph [ref=f35e501]: From the sidebar, you can browse your project's resources, its file tree, and the database.
            - list [ref=f35e502]:
              - listitem [ref=f35e503]:
                - strong [ref=f35e504]: Resources
                - text: tab — All resources in the project organized by type. Select any resource type in the list and all those resources in the project will display as a table in the main section of the page. For a description on the different resource types (like models, metrics, and so on), refer to
                - link "About dbt projects" [ref=f35e505] [cursor=pointer]:
                  - /url: /docs/build/projects
                - text: .
                - list [ref=f35e506]:
                  - listitem [ref=f35e507]:
                    - link "Data health signals" [ref=f35e508] [cursor=pointer]:
                      - /url: /docs/explore/data-health-signals
                    - text: are visible to the right of the resource name under the
                    - strong [ref=f35e509]: Health
                    - text: column.
              - listitem [ref=f35e510]:
                - strong [ref=f35e511]: File Tree
                - text: tab — All resources in the project organized by the file in which they are defined. This mirrors the file tree in your dbt project repository.
              - listitem [ref=f35e512]:
                - strong [ref=f35e513]: Database
                - text: tab — All resources in the project organized by the database and schema in which they are built. This mirrors your data platform's structure that represents the
                - link "applied state" [ref=f35e514] [cursor=pointer]:
                  - /url: /docs/dbt-apis/project-state
                - text: of your project.
            - heading [level=2] [ref=f35e515] [cursor=pointer]:
              - text: Integrated tool access
              - link "Direct link to Integrated tool access" [ref=f35e516]:
                - /url: "#integrated-tool-access"
            - paragraph [ref=f35e517]:
              - text: Users with a
              - link "developer license" [ref=f35e518] [cursor=pointer]:
                - /url: /docs/platform/manage-access/about-user-access#license-based-access-control
              - text: or an analyst seat* can open a resource directly from the Catalog in the Studio IDE to view its model files, in Insights to query it, or in Canvas for visual editing.
            - paragraph [ref=f35e519]:
              - text: "* The"
              - link "Analyst license type" [ref=f35e520] [cursor=pointer]:
                - /url: /docs/platform/manage-access/about-user-access?version=1.12#licenses
              - text: is not available for new purchase.
            - heading [level=2] [ref=f35e521] [cursor=pointer]:
              - text: View model versions
              - link "Direct link to View model versions" [ref=f35e522]:
                - /url: "#view-model-versions"
            - paragraph [ref=f35e523]:
              - text: If models in the project are versioned, you can see which
              - link "version of the model" [ref=f35e524] [cursor=pointer]:
                - /url: /docs/mesh/govern/model-versions
              - text: is being applied —
              - code [ref=f35e525]: prerelease
              - text: ","
              - code [ref=f35e526]: latest
              - text: ", and"
              - code [ref=f35e527]: old
              - text: — in the title of the model's details page and in the model list from the sidebar.
            - heading [level=2] [ref=f35e528] [cursor=pointer]:
              - text: View resource details
              - link "Direct link to View resource details" [ref=f35e529]:
                - /url: "#view-resource-details"
            - paragraph [ref=f35e530]: You can view the definition and latest run results of any resource in your project. To find a resource and view its details, you can interact with the lineage graph, use search, or browse the Catalog.
            - paragraph [ref=f35e531]:
              - text: The details (metadata) available to you depends on the resource's type, its definition, and the
              - link "commands" [ref=f35e532] [cursor=pointer]:
                - /url: /docs/deploy/job-commands
              - text: that run within jobs in the production environment.
            - paragraph [ref=f35e533]: "In the upper right corner of the resource details page, you can:"
            - list [ref=f35e534]:
              - listitem [ref=f35e535]:
                - text: Click the
                - link "Open in Studio IDE" [ref=f35e536] [cursor=pointer]:
                  - /url: "#open-in-ide"
                - text: icon to examine the resource using the
                - link "Studio IDE" [ref=f35e537] [cursor=pointer]:
                  - /url: /docs/platform/studio-ide/develop-in-studio
                - text: .
              - listitem [ref=f35e538]: Click the Share icon to copy the page's link to your clipboard.
