          - generic [ref=f34e42]:
            - paragraph [ref=f34e43]: The PowerMetrics metric overview is a dedicated page where you can visualize a metric from multiple perspectives, apply date ranges and filters, personalize each view, overlay analyses, set and track goals, and access metric details — all in one place. Personalizations are saved per user and persist between sessions; you can reset any view to its defaults at any time.
            - paragraph [ref=f34e44]:
              - text: As with all PowerMetrics features, the overview page is flexible and customizable. In this article, you'll learn how to
              - strong [ref=f34e45]: personalize
              - text: and
              - strong [ref=f34e46]: view
              - text: your metrics. For detailed information on
              - strong [ref=f34e47]: editing
              - text: a metric's underlying data and configuration, see
              - link "\"How do I edit metrics?\"" [ref=f34e48] [cursor=pointer]:
                - /url: https://support.powermetrics.app/hc/en-us/articles/37726244977047-editing-metrics
            - paragraph [ref=f34e49]: "This article includes:"
            - list [ref=f34e50]:
              - listitem [ref=f34e51]:
                - link "How do I open a metric?" [ref=f34e52] [cursor=pointer]:
                  - /url: "#open"
              - listitem [ref=f34e53]:
                - link "How do I navigate the metric overview?" [ref=f34e54] [cursor=pointer]:
                  - /url: "#design"
