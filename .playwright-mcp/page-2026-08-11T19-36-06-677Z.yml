        - strong [ref=f10e219]: What matches our design and what does not.
        - text: "What matches is the delivery conditions: no login, placed inside the tool the person already works in, contextualised to them. What does not match is the object: theirs is a dashboard to be explored, ours is a single number with its provenance. So it measures how often a placed, frictionless destination is entered, which is the assumption underneath our design rather than the design itself."
      - paragraph [ref=f10e220]:
        - strong [ref=f10e221]: Routes that returned nothing, recorded so they are not paid for twice.
        - text: "G2 returns 403 on review pages. TrustRadius reads without an account, and what was actually read is the reviews that rendered without scrolling, all of it product feedback from people who build reports. The dbt forum was searched on three trust phrasings and returned technical threads. Locally Optimistic answers 301 without resolving. Hacker News gave nothing on the contradiction in a meeting after roughly a dozen phrasings, which is a result about our queries rather than proof the corpus is empty: the follow-up found a new source on the thirteenth."
