        - generic [ref=f10e216]: The hardest source in this research, quoted in full because paraphrase would soften it
        - paragraph [ref=f10e217]: "\"We pretty quickly found that sending data (\"push\") was way more effective at engagement than just having a tableau report they could go to (\"pull\"), even when that dashboard was linked directly within the EHR, didn't require a login, and was contextualized for the provider (basically as low friction as you could get-- they would actually venture into it 1-2 times per year).\""
