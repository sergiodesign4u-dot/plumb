        - heading "Automatically refactor models and columns" [level=2] [ref=f98e232]
        - paragraph [ref=f98e233]: Deep SQL awareness keeps your project consistent as it evolves. Rename a model or column once, and dbt automatically updates every downstream reference. Before committing, preview all proposed changes so you can refactor quickly and confidently.
