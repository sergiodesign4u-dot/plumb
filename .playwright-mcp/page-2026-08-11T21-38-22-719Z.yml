      - heading "Powered by the brand new Fusion engine, dbt makes data teams extraordinarily productive as they build data models—whether locally or in the cloud." [level=3] [ref=f98e197]
      - generic [ref=f98e204]:
        - generic [ref=f98e205]: Empower teams
        - heading "Transform data with SQL" [level=2] [ref=f98e206]
        - paragraph [ref=f98e207]: "Build data pipelines the way software engineers build apps: modular, tested, and version-controlled. Native SQL comprehension and local validation catch issues before they hit the warehouse, while multi-dialect compilation keeps logic portable as your data platform evolves."
        - button "Start developing today" [ref=f98e209] [cursor=pointer]
      - generic [ref=f98e219]:
        - generic [ref=f98e220]: Build context
        - heading "Interactive lineage across projects and columns" [level=2] [ref=f98e221]
        - paragraph [ref=f98e222]: See exactly how your data flows and transforms across projects with a live and interactive DAG. Filter by model type, materialization, or dependency, and drill down to column-level lineage to trace where fields come from, how they’re transformed, or when they’re renamed.
        - link "Read Fusion docs" [ref=f98e224] [cursor=pointer]:
