      - list [ref=f28e202]:
        - listitem [ref=f28e203]:
          - strong [ref=f28e204]: 3.1 Sources, MVP.
          - text: "It came out of the navigation: the base layer put a \"Sources\" item in the analyst's menu, and a menu item with no list behind it is a promise with no node."
        - listitem [ref=f28e205]:
          - strong [ref=f28e206]: 0.2 Footer, MVP.
          - text: The number card is a public page with no account, and it cannot ship with no anchor at all for whose product this is and under what terms.
        - listitem [ref=f28e207]:
          - strong [ref=f28e208]: 0.3 Toast and inline feedback, MVP.
          - text: Sending a link, saving a definition and failing at either need somewhere to say what happened.
        - listitem [ref=f28e209]:
          - strong [ref=f28e210]: 7.1 404, MVP, and it matters more here than in most products.
          - text: The reader's only entrance is a link, so a broken or expired link is their first contact with us rather than a rare edge.
        - listitem [ref=f28e211]:
          - strong [ref=f28e212]: 7.2 500, MVP
          - text: ", for the same reason."
      - paragraph [ref=f28e213]:
        - strong [ref=f28e214]: One discrepancy, not corrected silently.
        - text: The cookie notice is labelled ПОТІМ because the market is US B2B and GDPR was deliberately deferred. But the public card with no account will almost certainly carry analytics, and at that point the question stops being legal and becomes a product question
        - strong [ref=f28e215]: on the very screen where we promise to store nothing about the reader
        - text: . The label stays, the discrepancy is recorded, and the system-nodes step comes back to it.
