      - generic [ref=f33e115]:
        - generic [ref=f33e116]: Auto-dismissal is a conformance question, not a preference
        - paragraph [ref=f33e117]:
          - text: WCAG 2.2 SC 2.2.1 Timing Adjustable is
          - strong [ref=f33e118]: Level A
          - text: ": for each time limit set by the content, the user must be able to turn it off, adjust it or extend it, unless a stated exception applies. An auto-dismissing toast is a time limit."
      - list [ref=f33e119]:
        - listitem [ref=f33e120]:
          - strong [ref=f33e121]: A toast that carries an action does not auto-dismiss.
          - text: Removing an "Undo" on a timer removes the only route to it.
        - listitem [ref=f33e122]:
          - strong [ref=f33e123]: A toast that only confirms may auto-dismiss
          - text: ", and the same information stays available: the link is in the clipboard, the saved definition is on the screen behind it."
        - listitem [ref=f33e124]:
          - strong [ref=f33e125]: No toast is the only copy of anything.
