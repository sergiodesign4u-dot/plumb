        - paragraph [ref=f18e123]:
          - text: "The reading was left open here: either a stored object, or a moment encoded in the link. Flow 3 showed there is no third option. If the link does not carry the moment it was read, the state degrades to \"the definition changed at some point\", which asks the reader to remember when they took the number, and that is the very thing they came to us to avoid."
          - strong [ref=f18e124]: It travels in the link.
      - generic [ref=f18e125]:
        - paragraph [ref=f18e126]: Under question, because no job sits under them. The workspace lives in the funnel metrics and is needed for tenancy and billing, and it closes no job. The link as an object is either a property of the metric or an analytics event, not something a person handles.
        - paragraph [ref=f18e127]: "Deliberately not entities. A state is not an entity, and this is the most important line in the inventory. \"As of\", \"source is down\" and \"definition changed after this was saved\" are computed and store nothing. The moment a state gets its own entity it gets a list, a status and a queue, and we have built an incident tool, which the design principles forbid outright. The registry is not an entity, it is a view over metrics. And the reader has no user object at all: the primary persona has no account by decision, so nothing in the product represents them. That is why there is no \"my profile\", no \"my saved\" and no \"my settings\" for the person the interface is built around."
