      - heading "Global navigation, and the column that is empty on purpose" [level=1] [ref=f30e8]
      - paragraph [ref=f30e9]: The first structural node, and the one that sets the level of detail for the other thirty-six. Two destinations, no hamburger, no bottom tab bar, and nothing at all for the person this product is built around.
      - generic [ref=f30e10]:
        - generic [ref=f30e11]: "Type: section"
        - generic [ref=f30e12]: "Scope: MVP"
        - generic [ref=f30e13]:
