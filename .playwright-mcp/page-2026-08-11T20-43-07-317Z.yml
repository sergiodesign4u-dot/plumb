        - rowgroup [ref=f30e37]:
          - row [ref=f30e38]:
            - cell "\"If your site has more than 5 options, it's hard to fit them in a tab or navigation bar and still keep an optimum touch-target size\", and tab bars are \"well suited for sites with relatively few navigation options\"" [ref=f30e39]
            - cell "Nielsen Norman Group, mobile navigation patterns" [ref=f30e40]
            - cell "Two destinations, far below the ceiling. Fit is not our problem" [ref=f30e41]
          - row [ref=f30e42]:
            - cell "\"The navigation menu makes the navigation options least discoverable\", and out of sight is out of mind" [ref=f30e43]
            - cell "Nielsen Norman Group, same article" [ref=f30e44]
            - cell [ref=f30e45]:
              - strong [ref=f30e46]: No hamburger.
              - text: With two destinations, hiding them costs discoverability and buys nothing
          - row [ref=f30e47]:
            - cell "Target size minimum is \"at least 24 by 24 CSS pixels\", Level AA; the enhanced criterion is \"at least 44 by 44 CSS pixels\", Level AAA" [ref=f30e48]
            - cell "W3C, Understanding WCAG 2.2, SC 2.5.8 and SC 2.5.5" [ref=f30e49]
            - cell [ref=f30e50]:
              - text: Targets here are built to
              - strong [ref=f30e51]: 44px
              - text: ", the AAA figure, because the cost of doing so is zero"
      - generic [ref=f30e52]:
        - generic [ref=f30e53]: A deliberate departure from the usual answer
        - paragraph [ref=f30e54]:
          - text: The obvious mobile pattern is a bottom tab bar of four or five items.
          - strong [ref=f30e55]: We are not building one.
          - text: With two destinations plus an account corner, a bottom bar would spend the most valuable strip of a phone screen on almost nothing, and the analyst's dense work belongs on the desktop while the phone is the read and verify path. The phone case that actually matters here is the
          - strong [ref=f30e56]: reader
          - text: opening a card, and the reader has no navigation at all. One top bar at both widths, and the bottom of the phone screen stays free for content.
