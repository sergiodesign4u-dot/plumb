    - generic [ref=f30e15]:
      - generic [ref=f30e16]:
        - generic [ref=f30e17]: "01"
        - heading "The decision this node records" [level=2] [ref=f30e18]
      - generic [ref=f30e19]:
        - generic [ref=f30e20]: The guest state of this component is empty, and that is the design
        - paragraph [ref=f30e21]:
          - text: "The reader has no global navigation. It follows from the strongest measurement in this research: a destination a reader is expected to travel to gets entered once or twice a year, so what we build has to"
          - strong [ref=f30e22]: arrive with the number
          - text: rather than wait to be visited. A header with a logo and a menu on the number card would turn the card into a page of a site the reader has no reason to be on.
      - paragraph [ref=f30e23]:
        - strong [ref=f30e24]: So this component serves the secondary persona almost entirely.
        - text: "The analyst signs in and gets two destinations. A guest sees the card, the footer, and nothing else, including no invitation to sign in: offering an account to somebody who will never have one is noise, and the route to signing in lives on the public product page and in the footer."
    - generic [ref=f30e25]:
      - generic [ref=f30e26]:
